
services:
  - type: web
    name: armo-ai-console
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: RCON_HOST
        sync: false
      - key: RCON_PORT
        value: "25575"
      - key: RCON_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FLASK_SECRET
        generateValue: true
